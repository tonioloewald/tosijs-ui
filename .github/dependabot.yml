# Dependabot config. Alerts are already on automatically for this public repo; this adds
# routine version-update PRs.
#
# This is the continuous-drift complement to the build-time audit gate
# (src/doc-system/site/audit-guard.ts): Dependabot notifies + opens PRs; the gate
# makes an unaddressed high+ advisory fail the build so it can't be ignored.
#
# Grouped + capped to keep the churn reviewable — a "patch" that moves dozens of
# transitive deps is itself a supply-chain surface worth eyeing (see the gate's
# due-diligence note).
#
# `bun`, not `npm`, since bun.lock became committed (1.15.3): the npm updater cannot run Bun
# against it ("Dependabot could not run Bun … configuration error" on every run). Per GitHub's
# docs the bun ecosystem does VERSION updates but not SECURITY-update PRs. Dependabot ALERTS
# still fire (a separate feature, on for this public repo), and the build's audit gate fails on
# any unaddressed high+ advisory, so what is lost is only the auto-opened fix PR.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Security fixes flow regardless of these; this bounds routine version bumps.
    # Majors are NOT grouped: each arrives as its own PR, because each is a decision (prettier 3
    # reformats the repo, TypeScript 7 removed a compiler option we set, chokidar 5 is the dev
    # server's watcher). One group mixing four majors with ten patches (#193) could only be
    # merged whole or not at all.
    groups:
      codemirror:
        patterns:
          - '@codemirror/*'
          - '@lezer/*'
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
